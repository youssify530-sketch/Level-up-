<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEVEL UP</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Tajawal:wght@400;500;700&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#080D19;--bg2:#101A2B;--bl:#398BFF;--cy:#57D8FF;--tx:#E8F0FF;--mut:#93A6C6;--ln:rgba(87,216,255,.22);--ac:#57D8FF;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=light]{--bg:#EDF3FF;--bg2:#fff;--tx:#0B1630;--mut:#475A7C;--ln:rgba(20,80,200,.25);--ac:#1566E0;color-scheme:light}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.6 Tajawal,system-ui,sans-serif;background-image:radial-gradient(900px 400px at 85% -10%,rgba(57,139,255,.18),transparent)}
h1,h2,h3,.disp{font-family:Rajdhani,Tajawal,sans-serif;font-weight:700;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.panel{background:var(--bg2);border:1px solid var(--ln);border-radius:4px 20px 4px 20px;padding:18px}
.btn{background:linear-gradient(135deg,var(--bl),#2a6fe0);color:#fff;border:0;border-radius:4px 14px 4px 14px;padding:11px 20px;font-weight:700;min-height:44px;box-shadow:0 0 18px rgba(57,139,255,.35)}
.btn.ghost{background:transparent;border:1px solid var(--ln);color:var(--tx);box-shadow:none}
.chip{display:inline-block;margin:4px;padding:9px 14px;border:1px solid var(--ln);border-radius:99px;background:transparent;min-height:44px}
.chip.on{background:var(--bl);color:#fff;border-color:var(--cy)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px;min-height:44px}
label{display:block;margin:14px 0 4px;color:var(--mut);font-size:.9rem}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--cy));border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.muted{color:var(--mut);font-size:.9rem}
.note{border:1px dashed var(--cy);border-radius:10px;padding:10px 12px;color:var(--mut);font-size:.88rem;margin:12px 0}
#shell{display:flex;min-height:100vh}
nav{position:fixed;z-index:5;background:var(--bg2);border:0 solid var(--ln)}
nav button{background:none;border:0;color:var(--mut);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;min-width:64px}
nav button.on{color:var(--ac);background:rgba(57,139,255,.14)}
nav .ic{font-size:1.3rem}
main{flex:1;padding:20px 16px 110px;max-width:1100px;margin:0 auto;width:100%}
@media(max-width:899px){nav{bottom:0;left:0;right:0;display:flex;overflow-x:auto;border-top-width:1px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav button{flex-direction:column;gap:0;font-size:.7rem;padding:6px 10px}nav .lg{display:none}}
@media(min-width:900px){nav{top:0;bottom:0;inset-inline-start:0;width:230px;padding:24px 14px;border-inline-end-width:1px;display:flex;flex-direction:column;gap:4px}main{margin-inline-start:230px;padding:32px 36px;max-width:none}main>.wrap{max-width:1340px;margin:auto}nav button{font-size:1rem}}
.lg{font:700 1.3rem Rajdhani;color:var(--cy);padding:0 14px 16px;letter-spacing:.06em}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.emb{position:relative;width:170px;height:170px;flex:none}
.emb svg{width:100%;height:100%;overflow:visible}
.emb .r{position:absolute;inset:0;display:grid;place-items:center;font:700 3.6rem Rajdhani;color:var(--cy);text-shadow:0 0 22px var(--bl);direction:ltr}
.mis{display:flex;gap:12px;align-items:center;margin:10px 0}
.mis .go{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--cy);background:none;font-size:1.2rem;color:var(--cy)}
.mis.done .go{background:var(--cy);color:var(--bg)}
.mis.done .tt{text-decoration:line-through;opacity:.6}
.tag{font-size:.75rem;border:1px solid var(--ln);padding:1px 8px;border-radius:99px;color:var(--mut)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(4,8,18,.88);display:grid;place-items:center;text-align:center}
.ov .big{font:700 clamp(3rem,14vw,6rem) Rajdhani;color:var(--cy);text-shadow:0 0 40px var(--bl);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.ov .ring{position:absolute;width:40px;height:40px;border:3px solid var(--cy);border-radius:50%;animation:rg 1.4s ease-out infinite}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes rg{to{transform:scale(14);opacity:0}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{padding:10px 0;border-radius:8px;background:var(--bg);font-size:.9rem}
.cal .a{background:var(--bl);color:#fff}
.bars{display:flex;gap:8px;align-items:flex-end;height:140px}
.bars div{flex:1;background:linear-gradient(var(--cy),var(--bl));border-radius:6px 6px 0 0;min-height:3px;position:relative}
.bars span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--mut)}
.lock{opacity:.45;filter:grayscale(1)}
.msg{white-space:pre-line;margin:10px 0}
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 18px}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:4px 14px 4px 14px;border:1px solid var(--ln);background:var(--bg2);font:700 1.1rem Rajdhani}.cell.ok{background:var(--bl);color:#fff}.cell.bad{border-color:#ff6b81;color:#ff6b81}.cell.cur{border-color:var(--cy);box-shadow:0 0 16px var(--bl);font-size:1.6rem}.sys{border-color:var(--cy);box-shadow:inset 0 0 22px rgba(57,139,255,.25)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#nova{position:fixed;z-index:8;inset-inline-end:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(300px,calc(100vw - 20px))}
@media(min-width:900px){#nova{bottom:24px}}
#nova img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid var(--cy);box-shadow:0 0 26px var(--bl);cursor:pointer;animation:flt 3.2s ease-in-out infinite;background:var(--bg2)}
#nova[data-s=sleep] img{filter:brightness(.7);animation-duration:6s}
#nova[data-s=great] img{animation:hop .5s 3}
.nb{background:var(--bg2);border:1px solid var(--cy);border-radius:4px 16px 4px 16px;padding:10px 14px;font-size:.92rem;box-shadow:0 0 18px rgba(57,139,255,.3)}
.nb[hidden]{display:none}
.nbt{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.nbt .btn{padding:6px 12px;min-height:40px}
@keyframes flt{50%{transform:translateY(-8px)}}@keyframes hop{50%{transform:translateY(-18px) scale(1.08)}}
.pt{position:fixed;z-index:30;pointer-events:none;color:var(--cy);font:700 1.2rem Rajdhani;text-shadow:0 0 8px var(--bl);animation:pf .9s ease-out forwards}
@keyframes pf{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}.st{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cy);opacity:0;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.7}}
.ent{animation:ent .35s ease-out}@keyframes ent{from{opacity:0;transform:translateY(10px)}}
.panel{position:relative}.panel::before{content:"";position:absolute;top:6px;inset-inline-start:6px;width:12px;height:12px;border-top:2px solid var(--cy);border-inline-start:2px solid var(--cy);opacity:.8}
.bar i{background-size:200% 100%;animation:sh 3s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.emb .r{animation:gl 2.6s ease-in-out infinite}@keyframes gl{50%{text-shadow:0 0 38px var(--cy)}}
.cnt>h2:first-child::before{content:"[ ";color:var(--cy)}.cnt>h2:first-child::after{content:" ]";color:var(--cy)}
.hero .emb{filter:drop-shadow(0 0 14px rgba(57,139,255,.5))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:8px 2px 12px;margin-bottom:6px;background:linear-gradient(var(--bg) 78%,transparent)}
.chip2{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--ln);background:var(--bg2);border-radius:4px 14px 4px 14px;padding:6px 12px;font:700 .95rem Rajdhani,Tajawal;min-height:40px;color:var(--tx)}
.chip2 .mini{width:76px;height:7px;display:inline-block}.chip2 small{color:var(--mut);font-weight:500}
.bell{position:relative}.bell b{position:absolute;top:-6px;inset-inline-end:-6px;background:#ff4d6d;color:#fff;border-radius:50%;min-width:20px;height:20px;font-size:.72rem;display:grid;place-items:center}
.av{margin-inline-start:auto;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--bl),var(--cy));color:#04101f;font:700 1.1rem Rajdhani}
.ncard{margin-top:auto;display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:4px 16px 4px 16px;padding:8px;cursor:pointer}.ncard img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--cy)}
@media(max-width:899px){.ncard{display:none}}
.mdl{align-items:start;overflow-y:auto;padding:16px;text-align:start}
.mbox{position:relative;max-width:860px;width:100%;margin:auto;background:var(--bg2);border:2px solid var(--cy);border-radius:6px 28px 6px 28px;box-shadow:0 0 40px rgba(57,139,255,.45),inset 0 0 40px rgba(57,139,255,.15);padding:22px 18px 18px}
.mx{position:absolute;top:10px;inset-inline-start:10px;width:44px;height:44px;border:1px solid var(--cy);border-radius:10px;background:var(--bg);color:var(--cy);font-size:1.2rem}
.mh{text-align:center;font-size:1.7rem;color:var(--cy);margin-bottom:14px;text-shadow:0 0 14px var(--bl)}
.mrow{display:flex;gap:16px;align-items:center}.mrow img{width:170px;height:170px;object-fit:cover;border-radius:18px;flex:none;border:1px solid var(--ln)}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.mc{border:1px solid;border-radius:4px 14px 4px 14px;padding:12px;text-align:center}.mc h4{margin:0 0 6px;font:700 1.05rem Rajdhani,Tajawal}.mc b{color:var(--tx);display:block}.mc small{display:block;font-size:.75rem;color:var(--mut)}
.mc.p{border-color:#ff5a6e;color:#ff8a98}.mc.r{border-color:#2ed47a;color:#3fcf83}.mc.d{border-color:#a07bff;color:#a98bff}
.m2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;border:1px solid var(--ln);border-radius:4px 14px 4px 14px;padding:12px}.m2 p{margin:4px 0 0}
.mq{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;color:#e0a800;font-size:.9rem}
.macc{clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);padding:14px 38px;font-size:1.1rem}
@media(max-width:699px){.mrow img{width:84px;height:84px}.m3,.m2{grid-template-columns:1fr}.mh{font-size:1.2rem}.mrow>div:last-child{display:none}}
nav button.on{border:1px solid var(--cy);background:linear-gradient(90deg,rgba(57,139,255,.28),transparent);box-shadow:0 0 14px rgba(57,139,255,.4)}
.lg::before{content:"⟁ "}.lg::after{content:"Your Life. Your Rules. Your Evolution.";display:block;font:500 .58rem Tajawal;color:var(--mut);letter-spacing:0;margin-top:2px}
.wrap{display:flex;gap:18px;align-items:flex-start}.cnt{flex:1;min-width:0}.rail{display:none}
@media(min-width:1180px){.rail{display:flex;flex-direction:column;gap:14px;width:250px;flex:none;position:sticky;top:70px}.hw{display:none}}
.cats{display:flex;gap:2px;overflow-x:auto;border:1px solid var(--ln);border-radius:4px 22px 4px 22px;background:var(--bg2);padding:6px;margin-bottom:12px}
.cat{background:none;border:0;border-inline-end:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;min-width:64px;flex:1;color:var(--mut);padding:6px 8px;font-size:.8rem}.cat:last-child{border:0}.cat span{font-size:1.4rem}.cat.on{color:var(--cy);text-shadow:0 0 10px var(--bl)}
#bgart{position:fixed;bottom:0;right:0;width:min(620px,70vw);aspect-ratio:522/117;background-size:cover;opacity:.5;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(to top,#000 30%,transparent);mask-image:linear-gradient(to top,#000 30%,transparent)}
:root[data-theme=light] #bgart{display:none}
:root{--na:#398BFF;--nf:none;--acc:""}
#nova img,.ncard img,.mrow img{filter:var(--nf)}
#nova img{box-shadow:0 0 26px var(--na);border-color:var(--na)}.ncard img{border-color:var(--na)}
#nova::after{content:var(--acc);position:absolute;bottom:62px;inset-inline-end:30px;font-size:2rem;pointer-events:none;animation:flt 3.2s ease-in-out infinite}
.pt{color:var(--na)}
.mi{position:relative;flex:none;display:block}.mi::after{content:var(--acc);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:2.6rem}
.mdl .mrow img{animation:fly .8s cubic-bezier(.2,1.3,.4,1),flt 3.2s ease-in-out .8s infinite;box-shadow:0 0 24px var(--na);border-color:var(--na)}
@keyframes fly{from{transform:translateX(-140%) rotate(-25deg);opacity:0}}
@media(min-height:700px){.mdl{padding-top:7vh}}
.pv{display:inline-block;width:64px;height:64px;border-radius:50%;object-fit:cover}
/* ===== ANIME UPGRADE ===== */
@property --rh{syntax:'<angle>';inherits:true;initial-value:0deg}
@keyframes rhs{to{--rh:360deg}}
:root.rbw{animation:rhs 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{to{opacity:.55;transform:scale(1.06)}}
#bgfx{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
#bgfx::before{content:"";position:absolute;left:50%;top:38%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--bl) 9%,transparent) 0 2deg,transparent 2deg 9deg);-webkit-mask-image:radial-gradient(circle,transparent 12%,#000 68%);mask-image:radial-gradient(circle,transparent 12%,#000 68%);animation:spin 120s linear infinite}
#bgfx::after{content:"";position:absolute;inset:0;background:radial-gradient(620px 320px at 8% 108%,rgba(255,80,120,.16),transparent),radial-gradient(760px 420px at 92% -8%,color-mix(in srgb,var(--bl) 26%,transparent),transparent);animation:breath 7s ease-in-out infinite alternate}
:root[data-theme=light] #bgfx{opacity:.45}
#fxc{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* panels, buttons, nav */
.panel{background-image:radial-gradient(color-mix(in srgb,var(--cy) 11%,transparent) 1px,transparent 1.6px);background-size:11px 11px;transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .25s,border-color .25s}
.panel:hover{transform:translateY(-3px);box-shadow:0 0 26px color-mix(in srgb,var(--bl) 45%,transparent);border-color:var(--cy)}
.btn{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .55s}
.btn:hover::after{left:135%}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px var(--bl)}
.btn:active{transform:scale(.93) skewX(-4deg)}
.chip{transition:transform .15s,background .2s,box-shadow .2s}.chip:hover{transform:translateY(-2px);box-shadow:0 0 14px var(--bl)}
.chip2{transition:transform .15s,box-shadow .2s}.chip2:hover{transform:translateY(-2px);box-shadow:0 0 14px var(--bl)}
nav button{transition:background .2s,transform .2s,box-shadow .2s,color .2s}
nav button:hover{transform:translateX(-4px);color:var(--cy)}
[dir=ltr] nav button:hover{transform:translateX(4px)}
nav .ic{display:inline-block;transition:transform .3s cubic-bezier(.2,1.8,.4,1)}
nav button:hover .ic{transform:scale(1.28) rotate(-10deg)}
nav button.on .ic{animation:icp 1.8s ease-in-out infinite}
@keyframes icp{50%{transform:scale(1.18)}}
.cnt>h2:first-child{text-shadow:2px 2px 0 color-mix(in srgb,var(--bl) 55%,transparent),0 0 18px color-mix(in srgb,var(--bl) 45%,transparent);letter-spacing:.03em}
.bar i{box-shadow:0 0 12px var(--cy)}
.emb::before,.emb::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.emb::before{inset:-12px;border:2px dashed var(--cy);opacity:.45;animation:spin 16s linear infinite}
.emb::after{inset:-24px;border:1px solid var(--bl);opacity:.35;animation:spin 26s linear infinite reverse}
.mis .go{transition:transform .2s cubic-bezier(.2,1.8,.4,1),background .2s}.mis .go:hover{transform:scale(1.2) rotate(15deg)}

/* section transitions */
@keyframes entx{from{opacity:0;transform:translateX(60px) skewX(-8deg);filter:blur(4px)}}
.ent{animation:entx .5s cubic-bezier(.2,.9,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(34px) skewY(3deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop2{from{opacity:0;transform:scale(.6) rotate(-4deg)}to{opacity:1;transform:none}}
.vchg .cnt>*{animation:rise .55s cubic-bezier(.2,.9,.2,1) both}
.vchg .cnt>*:nth-child(2){animation-delay:.06s}.vchg .cnt>*:nth-child(3){animation-delay:.12s}.vchg .cnt>*:nth-child(4){animation-delay:.18s}.vchg .cnt>*:nth-child(5){animation-delay:.24s}.vchg .cnt>*:nth-child(6){animation-delay:.3s}.vchg .cnt>*:nth-child(7){animation-delay:.36s}.vchg .cnt>*:nth-child(8){animation-delay:.42s}.vchg .cnt>*:nth-child(n+9){animation-delay:.48s}
.vchg .grid>*,.vchg .cats>*{animation:pop2 .5s cubic-bezier(.2,1.4,.4,1) both}
.vchg .grid>*:nth-child(2){animation-delay:.05s}.vchg .grid>*:nth-child(3){animation-delay:.1s}.vchg .grid>*:nth-child(4){animation-delay:.15s}.vchg .grid>*:nth-child(5){animation-delay:.2s}.vchg .grid>*:nth-child(6){animation-delay:.25s}.vchg .grid>*:nth-child(7){animation-delay:.3s}.vchg .grid>*:nth-child(8){animation-delay:.35s}.vchg .grid>*:nth-child(n+9){animation-delay:.4s}
#wipe{position:fixed;inset:0;z-index:60;pointer-events:none;direction:ltr;overflow:hidden;visibility:hidden}
#wipe.go{visibility:visible;animation:wvis .8s steps(1) forwards}
@keyframes wvis{0%,99%{visibility:visible}100%{visibility:hidden}}
#wipe i{position:absolute;top:-10%;bottom:-10%;left:-40%;width:180%;transform:translateX(-110%) skewX(-24deg)}
#wipe i:nth-child(1){background:var(--bl)}#wipe i:nth-child(2){background:var(--cy)}#wipe i:nth-child(3){background:#080D19}
#wipe.go i{animation:wsw .75s cubic-bezier(.7,0,.3,1) both}
#wipe.go i:nth-child(2){animation-delay:.05s}#wipe.go i:nth-child(3){animation-delay:.1s}
@keyframes wsw{0%{transform:translateX(-110%) skewX(-24deg)}30%,52%{transform:translateX(0) skewX(-24deg)}100%{transform:translateX(110%) skewX(-24deg)}}
#wipe b{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(2.4rem,12vw,6rem) Bungee,Rajdhani,Tajawal;color:#fff;text-shadow:0 0 30px var(--bl),4px 4px 0 #000;opacity:0}
#wipe.go b{animation:wtx .75s ease both}
@keyframes wtx{0%,26%{opacity:0;transform:scale(.6) skewX(-10deg)}42%{opacity:1;transform:scale(1.06) skewX(-10deg)}56%{opacity:1;transform:scale(1) skewX(-10deg)}78%,100%{opacity:0;transform:scale(1.35) skewX(-10deg)}}

/* effects */
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-6px,3px)}30%{transform:translate(5px,-4px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(3px,3px)}80%{transform:translate(-2px,1px)}}
body.shk main{animation:shk .4s}
.mcb{position:fixed;left:0;right:0;top:32%;z-index:45;pointer-events:none;direction:ltr;text-align:center;padding:16px 0;background:linear-gradient(90deg,transparent,rgba(8,13,25,.93) 16%,rgba(8,13,25,.93) 84%,transparent);border-block:2px solid var(--cy);box-shadow:0 0 40px var(--bl);animation:bnr 1.5s cubic-bezier(.2,.9,.2,1) forwards}
.mcb small{display:block;color:var(--cy);letter-spacing:.4em;font-size:.8rem}
.mcb b{display:block;font:400 clamp(1.8rem,8vw,3.4rem) Bungee,Rajdhani,Tajawal;color:#fff;text-shadow:0 0 20px var(--bl),3px 3px 0 var(--bl);transform:skewX(-10deg)}

function mList(sec){const a=missions().filter(m=>m.sec===sec&&(MF<0||GR[MF].includes(m.mod))&&(WF<0||WD[WF].m.includes(m.mod)));return a.map(m=>`<div class="mis panel ${isDone(m)?"done":""}"><button class="go" aria-label="done" onclick="finish('${m.id}')">${isDone(m)?"✓":"○"}</button><div style="flex:1;cursor:pointer" onclick="openM('${m.id}')"><div class="tt">${MODS[m.mod][0]} ${esc(m.t)}</div><span class="tag">${["★","★★","★★★"][m.d-1]}</span> <span class="tag">${m.m} ${t("min")}</span> <span class="tag">+${m.xp} XP</span>${S.acc&&S.acc[m.k+":"+m.id]&&!isDone(m)?' <span class="tag">⏳</span>':""}</div></div>`).join("")}
function ach(){const q=lv(S.xp).l,u=Object.keys(S.mx).length;return[["🌟",["أول مهمة","First mission","Première mission"],S.count>=1],["🔟",["10 مهام","10 missions","10 missions"],S.count>=10],["🔥",["3 أيام متتالية","3-day streak","3 jours de suite"],best()>=3],["🧭",["جرب 3 مجالات","Try 3 areas","Essaie 3 domaines"],u>=3],["🌐",["جرب 6 مجالات","Try 6 areas","Essaie 6 domaines"],u>=6],["⚡",["المستوى 5","Level 5","Niveau 5"],q>=5],["🛠️",["مهمة خاصة","Custom mission","Mission perso"],S.custom.length>0],["👑",["رتبة C","Rank C","Rang C"],q>=10]]}
const V={
home(){const td=missions().filter(m=>m.sec==="today"),dn=td.filter(isDone).length;return head()+`<div class="grid" style="margin-top:14px"><div class="panel"><h3>🔥 ${streak()} ${t("streak")}</h3><p class="muted">${t("rest")}</p></div><div class="panel"><h3>⚔️ ${S.count} ${t("done")}</h3><div class="bar"><i style="width:${td.length?dn/td.length*100:0}%"></i></div><p class="muted">${dn}/${td.length}</p></div></div><h2 style="margin:22px 0 4px">${t("today")}</h2>${mList("today")}`},
char(){const q=lv(S.xp);return head()+`<div class="grid" style="margin-top:14px"><div class="panel"><h3>${t("rank")}</h3><p class="disp" style="font-size:2rem;color:var(--ac)">${rank(q.l)}</p></div><div class="panel"><h3>${t("skill")}</h3><p class="disp" style="font-size:2rem;color:var(--ac)">${q.l-1}</p></div><div class="panel"><h3>${t("age")}</h3><p>${t(S.age)} · ${t(S.diff)} · ${S.mins} ${t("min")}</p></div></div>`+(S.age==="kid"?`<div class="note">${t("kidn")}</div>`:"")},
missions(){return`${chips()}<h2>${t("today")}</h2>${mList("today")}<h2 style="margin-top:22px">${t("week")}</h2>${mList("week")}<h2 style="margin-top:22px">${t("boss")}</h2>${mList("boss")}<div class="panel" style="margin-top:22px"><h3>${t("add")}</h3><label for="ct">${t("title")}</label><input id="ct" maxlength="80"><label for="cm">${t("min")}</label><input id="cm" type="number" min="5" max="180" value="15"><label for="cd">${t("diff")}</label><select id="cd"><option value="1">${t("easy")}</option><option value="2">${t("normal")}</option><option value="3">${t("adv")}</option></select><p><button class="btn" onclick="addM()">${t("addb")}</button></p></div>`},
dev(){return`<div class="grid">${MODS.map((m,i)=>{const x=S.mx[i]||0,q=lv(x*3);return`<div class="panel"><h3>${m[0]} ${m[1].split("|")[li()]}</h3><p class="muted">${t("lvl")} ${q.l} · ${x} XP</p><div class="bar"><i style="width:${q.cur/q.n*100}%"></i></div></div>`}).join("")}</div>`},
coach(){return`<div class="note">${t("coachp")}</div><p>${t("coachint")}</p>${[["plan","plan"],["sched","sched"],["work","work"],["mot","mot"]].map(a=>`<button class="chip" onclick="ask('${a[0]}')">${t(a[1])}</button>`).join("")}<div class="panel msg" id="co">${esc(coachOut)||"…"}</div>`},
stats(){const d=[6,5,4,3,2,1,0].map(o=>[day(o),S.hist[day(o)]||0]),mx=Math.max(20,...d.map(x=>x[1]));return`<div class="panel"><h3>${t("last7")}</h3><div class="bars" style="margin:16px 0 30px">${d.map(x=>`<div style="height:${x[1]/mx*100}%"><span>${x[0].slice(8)}</span></div>`).join("")}</div></div><div class="panel" style="margin-top:14px"><h3>${t("bymod")}</h3>${Object.keys(S.mx).length?Object.keys(S.mx).map(i=>`<p class="muted" style="margin:10px 0 2px">${MODS[i][0]} ${MODS[i][1].split("|")[li()]} · ${S.mx[i]} XP</p><div class="bar"><i style="width:${Math.min(100,S.mx[i]/3)}%"></i></div>`).join(""):`<p class="muted">${t("empty")}</p>`}</div><div class="grid" style="margin-top:14px"><div class="panel"><h3>${t("best")}</h3><p class="disp" style="font-size:2rem">${best()}</p></div><div class="panel"><h3>${t("done")}</h3><p class="disp" style="font-size:2rem">${S.count}</p></div></div>`},
ach(){return`<div class="grid">${ach().map(a=>`<div class="panel ${a[2]?"":"lock"}"><h3 style="font-size:2rem">${a[0]}</h3><p>${a[1][li()]}</p></div>`).join("")}</div>`},
cal(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),c=new Date(y,m+1,0).getDate();let h='<div class="panel"><div class="cal">';for(let i=0;i<f;i++)h+="<span></span>";for(let d=1;d<=c;d++){const k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");h+=`<div class="${S.hist[k]?"a":""}">${d}</div>`}return h+"</div></div>"},
set(){return`<div class="panel"><label for="sl">${t("lang")}</label><select id="sl" onchange="S.lang=this.value;setDir();save();render()"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option></select><label for="sd">${t("diff")}</label><select id="sd" onchange="S.diff=this.value;save();render()">${DIFFS.map(d=>`<option value="${d}" ${S.diff===d?"selected":""}>${t(d)}</option>`).join("")}</select><p><button class="btn ghost" onclick="theme()">${t("theme")}</button> <button class="btn ghost" onclick="if(confirm('?')){localStorage.removeItem(KEY);S=null;step=0;render()}">${t("reset")}</button></p></div><div class="note">${t("proto")}</div><div class="note">${t("kidn")}</div>`}};
function gain(n,mod){S.xp+=n;S.mx[mod]=(S.mx[mod]||0)+n;S.hist[day()]=(S.hist[day()]||0)+n}
function trAns(a){const r=S.tr,i=r.res.length,s=ST[i],ok=a===s[2],b=lv(S.xp).l;let m;
 if(ok){let g=i===11?60:10;if(i===3||i===7)g+=25;gain(g,s[0]);m=t("right")+" +"+g+" XP"+(g>=25?" 🎁":"")}
 else{r.hp--;const l=Math.min(5,lv(S.xp).cur);S.xp-=l;r.pen=Math.floor(Math.random()*3);m=t("wrong")+" -"+l+" XP · "+t("ans")+": "+t(s[2]?"tT":"tF")}
 r.res.push(ok?1:0);r.msg=m;save();render();const a2=lv(S.xp).l;if(a2>b)levelUp(a2)}
function penDone(){const b=lv(S.xp).l;S.tr.pen=null;S.tr.hp=Math.min(3,S.tr.hp+1);gain(5,13);S.tr.msg="+5 XP";save();render();const a=lv(S.xp).l;if(a>b)levelUp(a)}
V.train=function(){const r=S.tr=S.tr||{res:[],hp:3,pen:null,day:day(),msg:""};if(r.day!==day()){r.day=day();r.hp=3}
 const n=ST.length,i=r.res.length;
 const path='<div class="path">'+ST.map((s,k)=>`<div class="cell ${k<i?(r.res[k]?"ok":"bad"):k===i?"cur":""}">${k<i?(r.res[k]?"✓":"✗"):k===i?"🧙":(k===3||k===7?"🎁":k===11?"👹":k+1)}</div>`).join("")+"</div>";
 const hp="❤️".repeat(Math.max(0,r.hp))+"🖤".repeat(3-Math.max(0,r.hp));let body;
 if(r.pen!==null)body=`<div class="panel sys"><h3>⚠️ ${t("pen")}</h3><p>${PEN[li()][r.pen]}</p><button class="btn" onclick="penDone()">${t("pend")}</button></div>`;
 else if(i>=n)body=`<div class="panel sys"><h3>🏁 ${t("fin")}</h3><p class="disp" style="font-size:1.6rem">${r.res.filter(x=>x).length}/${n}</p><button class="btn" onclick="S.tr={res:[],hp:3,pen:null,day:day(),msg:''};save();render()">${t("again")}</button></div>`;
 else if(r.hp<=0)body=`<div class="panel sys"><p>${t("rest")}</p></div>`;
 else{const s=ST[i];body=`<div class="panel sys"><p class="muted">${t("sys")}</p><h3 style="margin:10px 0 18px">${i===11?"👹 ":""}${s[1].split("|")[li()]}</h3><button class="btn" onclick="trAns(1)">${t("tT")}</button> <button class="btn ghost" onclick="trAns(0)">${t("tF")}</button></div>`}
 return`<p class="disp" style="font-size:1.2rem">${t("hp")} ${hp}</p>${path}${r.msg?`<p class="disp" style="color:var(--ac);font-size:1.2rem">${r.msg}</p>`:""}${body}`};

function mkNova(){const el=document.createElement("div");el.id="nova";el.innerHTML='<div class="nb" hidden></div><img alt="NOVA" width="92" height="92" tabindex="0" role="button">';document.body.appendChild(el);
 const im=el.querySelector("img");im.onclick=offer;im.onkeydown=e=>{if(e.key==="Enter")offer()};
 el.querySelector(".nb").onclick=e=>{if(!e.target.closest("button"))e.currentTarget.hidden=true}}
function nova(s,txt,html){const el=document.getElementById("nova");if(!el)return;NS.s=s;el.dataset.s=s;el.querySelector("img").src=NI[s==="offer"?"think":s];
 const b=el.querySelector(".nb");b.hidden=false;clearInterval(NS.tw);
 if(html){b.innerHTML=html;return}
 txt=txt||nt(s);b.textContent="";let i=0;NS.tw=setInterval(()=>{b.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(NS.tw)},22)}
function nHide(){const b=document.querySelector("#nova .nb");if(b)b.hidden=true}
function offer(){const m=missions().find(x=>!isDone(x)&&x.sec!=="boss");
 if(!m){nova("great",nt("none"));return}
 nova("offer",null,`<b>${nt("next")}</b><br>${MODS[m.mod][0]} ${esc(m.t)}<br><span class="tag">+${m.xp} XP</span> <span class="tag">${m.m} ${t("min")}</span><div class="nbt"><button class="btn" onclick="finish('${m.id}')">${nt("ok")}</button><button class="btn ghost" onclick="nHide()">${nt("later")}</button></div>`)}
function burst(label){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const el=document.getElementById("nova"),r=el?el.querySelector("img").getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let i=0;i<20;i++){const p=document.createElement("i"),a=Math.random()*6.28,d=60+Math.random()*100;p.className="pt";p.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;p.textContent=i===0&&label?label:["✦","✧","+"][i%3];document.body.appendChild(p);setTimeout(()=>p.remove(),900)}}
const _fin=finish;finish=function(id){const m=missions().find(x=>x.id===id);if(!m||isDone(m))return;_fin(id);burst("+"+m.xp+" XP");nova("great",nt("great")+" +"+m.xp+" XP");void 0};
const _ta=trAns;trAns=function(a){const s=ST[S.tr.res.length],ok=a===s[2];_ta(a);if(ok){burst("+XP");nova("great")}else nova("cheer")};

 if(!S){const n=document.getElementById("nova");if(n)n.remove();return}
 if(!document.getElementById("nova")){mkNova();nova("hi");NS.v=view;setTimeout(()=>{if(NS.s==="hi"&&S.pop!==day()){S.pop=day();save();offer()}},4000)}
 else if(view!==NS.v){NS.v=view;const d=document.querySelector("main>div");if(d)d.classList.add("ent");if(view==="coach")nova("think");else if(view==="train")nova("cheer")}};

setInterval(()=>{if(!document.getElementById("nova"))return;const i=Date.now()-NS.last;if(i>60000&&NS.s!=="sleep")nova("sleep");else if(i>25000&&i<=60000&&["hi","great","cheer"].includes(NS.s))nova("think")},4000);

function ensure(){S.coins=S.coins||0;S.gems=S.gems||0;S.acc=S.acc||{};S.pd=S.pd||{};S.nf=S.nf||[];if(S.en==null)S.en=100;
